[package]
name = "ce-app"
description = "Application graphique de Computer Engineer : plan interactif, simulation en direct, panneaux."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "computer-engineer"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Exécutable d'essai des mises à jour (CI seulement, jamais publié) : voir `src/main.rs`.
banc-mise-a-jour = []

[build-dependencies]
# Icône et fiche de l'exécutable Windows (build.rs).
winresource = { version = "0.1", default-features = false }

[dependencies]
ce-moteur = { path = "../moteur" }
ce-circuit = { path = "../circuit" }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui = "0.37"
# Mises à jour automatiques : bibliothèques éprouvées, rien de fait maison (docs/mises-a-jour.md).
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "native-certs", "github", "archive-zip", "compression-zip-deflate", "signatures"] }

# Windows seulement, à travers des enveloppes sûres (aucun code `unsafe` dans l'application) :
# raccourcis du bureau et du menu Démarrer (IShellLink), et boîte de message quand la fenêtre
# ne peut pas s'ouvrir (il n'y a pas de console).
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["shell", "advapi", "user"] }

[dev-dependencies]
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-zip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
